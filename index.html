<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>英単語学習アプリ</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273549; --fg:#f1f5f9; --muted:#94a3b8;
    --accent:#6366f1; --accent2:#818cf8; --ok:#22c55e; --ng:#ef4444; --line:#334155; --warn:#f59e0b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg); color:var(--fg); line-height:1.5;
    max-width:520px; margin:0 auto; min-height:100vh; padding:0 14px 90px;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(15,23,42,.92); backdrop-filter:blur(8px);
    padding:14px 2px 10px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line);
  }
  header h1{font-size:18px; margin:0; flex:1;}
  .pill{font-size:12px; color:var(--muted); background:var(--card); padding:4px 10px; border-radius:999px;}
  h2{font-size:16px; margin:22px 2px 10px;}
  .sub{color:var(--muted); font-size:13px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:12px; font-size:15px;}
  .btn{width:100%; padding:15px; background:var(--accent); color:#fff; font-weight:600; margin:8px 0;
       display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s;}
  .btn:active{transform:scale(.98);}
  .btn.sec{background:var(--card2); color:var(--fg); border:1px solid var(--line);}
  .btn.ghost{background:transparent; color:var(--accent2); border:1px solid var(--line);}
  .btn:disabled{opacity:.45;}
  .lvitem{display:flex; align-items:center; gap:12px; padding:12px 8px; border-bottom:1px solid var(--line);}
  .lvitem:last-child{border-bottom:none;}
  .lvitem label{flex:1; display:flex; flex-direction:column;}
  .lvitem .lvname{font-weight:600;}
  .lvitem .lvmeta{font-size:12px; color:var(--muted);}
  input[type=checkbox]{width:22px; height:22px; accent-color:var(--accent2);}
  .lvgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin:12px 0;}
  .lvchip{padding:9px 4px; border-radius:11px; background:var(--card2); border:1.5px solid var(--line);
          color:var(--fg); text-align:center; line-height:1.15; cursor:pointer; transition:.12s;}
  .lvchip:active{transform:scale(.96);}
  .lvchip b{display:block; font-size:14px; font-weight:700;}
  .lvchip small{display:block; font-size:9px; color:var(--muted); margin-top:1px;}
  .lvchip.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .lvchip.on small{color:#dbeafe;}
  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg button{flex:1; min-width:60px; padding:11px 6px; background:var(--card2); color:var(--fg); border:1px solid var(--line);}
  .seg button.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .stat{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center;}
  .stat .num{font-size:22px; font-weight:700;}
  .stat .num.due{color:var(--warn);}
  .stat .lbl{font-size:11px; color:var(--muted);}
  .hidden{display:none !important;}

  /* Quiz */
  .qtop{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin:6px 2px;}
  .bar{height:6px; background:var(--card2); border-radius:6px; overflow:hidden; margin:4px 0 10px;}
  .bar > i{display:block; height:100%; background:var(--accent2); width:0; transition:width .3s;}
  .dirtag{display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px; background:var(--card2);
          border:1px solid var(--line); color:var(--accent2); margin:2px auto 0;}
  .prompt{font-size:34px; font-weight:800; text-align:center; margin:12px 0 4px; word-break:break-word;}
  .prompt.ja{font-size:24px;}
  .wpos{text-align:center; color:var(--muted); font-size:13px; margin-bottom:4px;}
  .spk{display:block; margin:8px auto 4px; width:56px; height:56px; border-radius:50%; background:var(--card2);
       border:1px solid var(--line); font-size:24px; color:var(--accent2);}
  .spk:active{transform:scale(.94);}
  .opt{width:100%; text-align:left; padding:15px 16px; margin:9px 0; background:var(--card2); color:var(--fg);
       border:1.5px solid var(--line); font-size:16px; transition:.12s;}
  .opt:active{transform:scale(.99);}
  .opt.correct{background:rgba(34,197,94,.18); border-color:var(--ok); color:#bbf7d0;}
  .opt.wrong{background:rgba(239,68,68,.18); border-color:var(--ng); color:#fecaca;}
  .opt.dim{opacity:.5;}
  .fb{text-align:center; font-weight:700; margin:8px 0 2px; min-height:22px;}
  .fb.ok{color:var(--ok);} .fb.ng{color:var(--ng);}
  .answden{text-align:center; margin:2px 0 6px;}
  .answden .pair{font-size:18px; font-weight:700;}
  .answden .exline{color:var(--muted); font-size:13px; margin-top:2px;}

  /* Wordbook */
  .search{width:100%; padding:12px 14px; border-radius:12px; background:var(--card2); border:1px solid var(--line);
          color:var(--fg); font-size:15px; margin:6px 0 4px;}
  .wb{background:var(--card); border:1px solid var(--line); border-radius:12px; margin:10px 0; overflow:hidden;}
  .wbhead{display:flex; align-items:center; gap:10px; padding:14px;}
  .wbhead .w{font-size:19px; font-weight:700; flex:1;}
  .wbhead .tag{font-size:11px; color:var(--muted); background:var(--card2); padding:3px 8px; border-radius:8px;}
  .wbspk{width:40px; height:40px; border-radius:50%; background:var(--card2); border:1px solid var(--line); color:var(--accent2); font-size:18px;}
  .wbbody{padding:0 14px 14px; border-top:1px dashed var(--line);}
  .wbbody .ja{font-size:17px; font-weight:600; margin:10px 0 4px;}
  .wbbody .ex{color:var(--muted); font-size:13px;}
  .flag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:8px;}
  .flag.due{background:rgba(245,158,11,.15); color:#fde68a;}
  .flag.learning{background:rgba(129,140,248,.15); color:#c7d2fe;}
  .flag.ok{background:rgba(34,197,94,.15); color:#bbf7d0;}
  .flag.new{background:var(--card2); color:var(--muted);}
  .wbactions{display:flex; align-items:center; gap:10px; margin-top:12px;}
  .markbtn{margin-left:auto; padding:8px 14px; border-radius:9px; background:var(--ok); color:#052e16;
           border:none; font-size:12px; font-weight:700;}
  .markbtn:active{transform:scale(.97);}
  .markbtn.revert{background:var(--card2); color:var(--muted); border:1px solid var(--line);}
  .empty{text-align:center; color:var(--muted); padding:40px 10px;}
  footer{position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto; display:flex;
          background:rgba(15,23,42,.96); backdrop-filter:blur(8px); border-top:1px solid var(--line);}
  footer button{flex:1; background:transparent; color:var(--muted); padding:10px 2px 12px; font-size:11px;
                display:flex; flex-direction:column; align-items:center; gap:3px;}
  footer button .ic{font-size:20px;}
  footer button.on{color:var(--accent2);}
  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--card2);
         border:1px solid var(--line); color:var(--fg); padding:10px 16px; border-radius:999px; font-size:13px;
         opacity:0; transition:.25s; pointer-events:none; z-index:50; max-width:90%; text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <h1>📘 英単語学習</h1>
  <span class="pill" id="selInfo">—</span>
</header>

<!-- HOME -->
<section id="view-home">
  <div class="card">
    <div class="stat">
      <div><div class="num due" id="stDue">0</div><div class="lbl">今日の復習</div></div>
      <div><div class="num" id="stMastered">0</div><div class="lbl">覚えた</div></div>
      <div><div class="num" id="stAcc">0%</div><div class="lbl">正答率</div></div>
    </div>
  </div>

  <h2>レベルを選ぶ <span class="sub">（複数選択可・タップで選択）</span></h2>
  <div id="levelList" class="lvgrid"></div>
  <div class="seg" style="margin-top:-4px;">
    <button id="selAll" class="sec" style="flex:1;padding:10px;">すべて選択</button>
    <button id="selNone" class="sec" style="flex:1;padding:10px;">選択解除</button>
  </div>

  <h2>出題の向き</h2>
  <div class="seg" id="dirSeg">
    <button data-dir="e2j">英語→意味</button>
    <button data-dir="j2e">意味→英語</button>
    <button data-dir="mix">ミックス</button>
  </div>

  <h2>選択肢の難しさ</h2>
  <div class="seg" id="diffSeg">
    <button data-diff="easy">やさしい</button>
    <button data-diff="normal">ふつう</button>
    <button data-diff="hard">むずかしい</button>
  </div>
  <div class="sub" id="diffHint" style="margin:6px 2px 0;"></div>

  <h2>1回の語数</h2>
  <div class="seg" id="lenSeg">
    <button data-len="10">10問</button>
    <button data-len="20">20問</button>
    <button data-len="50">50問</button>
    <button data-len="all">全部</button>
  </div>

  <h2>スタート</h2>
  <button class="btn" id="startStudy">▶ 学習スタート <span class="sub" id="studyHint" style="color:#dbeafe;"></span></button>
  <button class="btn ghost" id="startReview">🔁 今日の復習だけ <span id="reviewCount"></span></button>
  <button class="btn sec" id="startBook">📖 単語帳モード</button>
  <div class="sub" style="text-align:center;margin-top:14px;">間隔反復で復習タイミングを自動管理・進捗は端末に保存</div>
  <button class="btn ghost" id="resetProg" style="margin-top:8px;font-size:13px;padding:10px;">進捗をリセット</button>
</section>

<!-- QUIZ -->
<section id="view-quiz" class="hidden">
  <div class="qtop"><span id="qMode">学習</span><span id="qCount">1 / 10</span></div>
  <div class="bar"><i id="qBar"></i></div>
  <div class="card">
    <div style="text-align:center;"><span class="dirtag" id="qDir">英語→意味</span></div>
    <div class="prompt" id="qPrompt">—</div>
    <div class="wpos" id="qPos"></div>
    <button class="spk" id="qSpeak">🔊</button>
    <div id="qOptions"></div>
    <div class="fb" id="qFb"></div>
    <div class="answden hidden" id="qAns"></div>
    <button class="btn hidden" id="qNext">次へ ▶</button>
  </div>
  <button class="btn ghost" id="qQuit" style="font-size:13px;padding:10px;">やめてホームへ</button>
</section>

<!-- RESULT -->
<section id="view-result" class="hidden">
  <div class="card" style="text-align:center;">
    <div style="font-size:15px;color:var(--muted);">結果</div>
    <div style="font-size:44px;font-weight:800;margin:6px 0;" id="rScore">0 / 0</div>
    <div style="font-size:20px;font-weight:700;" id="rAcc">0%</div>
    <div class="sub" id="rMsg" style="margin-top:8px;"></div>
  </div>
  <button class="btn" id="rAgain">続けて学習</button>
  <button class="btn ghost" id="rReview">今日の復習だけ</button>
  <button class="btn sec" id="rHome">ホームへ</button>
</section>

<!-- WORDBOOK -->
<section id="view-book" class="hidden">
  <h2 style="margin-top:14px;">単語帳 <span class="sub" id="bookCount"></span></h2>
  <input class="search" id="bookSearch" placeholder="🔍 単語・意味で検索">
  <div class="seg" style="margin-bottom:6px;">
    <button class="sec on" id="bookAll" style="flex:1;padding:9px;">すべて</button>
    <button class="sec" id="bookDue" style="flex:1;padding:9px;">復習</button>
    <button class="sec" id="bookOk" style="flex:1;padding:9px;">覚えた</button>
  </div>
  <div id="bookList"></div>
</section>

<div class="toast" id="toast"></div>

<footer>
  <button data-nav="home" class="on"><span class="ic">🏠</span>ホーム</button>
  <button data-nav="book"><span class="ic">📖</span>単語帳</button>
  <button data-nav="reviewNav"><span class="ic">🔁</span>復習</button>
</footer>

// 品詞を基本カテゴリで判定（「名詞・動詞」等の複合表記にも対応）
const POS_BASES = ['動詞','名詞','形容詞','副詞','前置詞','助動詞','接続詞'];
function posBases(p){ return POS_BASES.filter(b => p.indexOf(b) >= 0); }
function posMatch(a, b){ const ka = posBases(a); if(!ka.length) return a===b; return ka.some(x => b.indexOf(x) >= 0); }
const rec = c => state.srs[c._id];

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

// ---- speech (American English native voice) ----
let usVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices();
  if(!all.length) return;
  const en = all.filter(v => /en[-_]US/i.test(v.lang) || /English \(United States\)|American/i.test(v.name));
  const pref = ['Google US English','Samantha','Ava (Premium)','Ava','Allison','Nicky','Aaron',
    'Microsoft Aria','Microsoft Jenny','Microsoft Ava','Microsoft Michelle','Microsoft Guy',
    'Microsoft Zira','Microsoft David'];
  for(const p of pref){ const hit = en.find(v => v.name.includes(p)); if(hit){ usVoice = hit; return; } }
  usVoice = en.find(v=>/en[-_]US/i.test(v.lang)) || en[0] || all.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let warnedNoEn = false;
function speak(text){
  if(!('speechSynthesis' in window)){ toast('この端末は発音に対応していません'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=.9; u.pitch=1;
  if(!usVoice) pickVoice();
  if(usVoice){ u.voice = usVoice; }
  else if(!warnedNoEn){ warnedNoEn=true; toast('米国英語の音声が未インストールです。Chromeで開くか英語(米国)音声を追加してください'); }
  speechSynthesis.speak(u);
}

// ---- views ----
function show(view){
  ['home','quiz','result','book'].forEach(v=> $('#view-'+v).classList.toggle('hidden', v!==view));
  const navMap = {home:'home', book:'book'};
  $$('footer button').forEach(b=> b.classList.toggle('on', b.dataset.nav===navMap[view]));
  window.scrollTo(0,0);
}
const selectedCards = () => WORDS.filter(c => state.levels.includes(c.level));
const dueCards = () => selectedCards().filter(c => rec(c) && rec(c).due <= now());
const newCards = () => selectedCards().filter(c => !rec(c));
const masteredCards = () => selectedCards().filter(c => rec(c) && rec(c).box>=5);

// ---- HOME ----
function renderHome(){
  $('#stDue').textContent = dueCards().length;
  $('#stMastered').textContent = masteredCards().length;
  const acc = state.stats.total ? Math.round(state.stats.correct/state.stats.total*100) : 0;
  $('#stAcc').textContent = acc+'%';
  const d = dueCards().length;
  $('#reviewCount').textContent = d ? '('+d+')' : '';
  $('#studyHint').textContent = '';

  const ll = $('#levelList'); ll.innerHTML='';
  LEVELS.forEach(lv=>{
    const cards = WORDS.filter(c=>c.level===lv);
    const ids = cards.map(c=>c.id), idMin=Math.min(...ids), idMax=Math.max(...ids);
    const chip = document.createElement('button');
    chip.className = 'lvchip' + (state.levels.includes(lv) ? ' on' : '');
    chip.innerHTML = `<b>Lv.${lv}</b><small>${idMin}–${idMax}</small>`;
    chip.addEventListener('click', ()=>{
      if(state.levels.includes(lv)) state.levels = state.levels.filter(x=>x!==lv);
      else state.levels.push(lv);
      state.levels.sort((a,b)=>a-b); save();
      chip.classList.toggle('on');
      $('#stDue').textContent = dueCards().length;
      $('#stMastered').textContent = masteredCards().length;
      const dd = dueCards().length; $('#reviewCount').textContent = dd ? '('+dd+')' : '';
      updateSelInfo();
    });
    ll.appendChild(chip);
  });
  $$('#lenSeg button').forEach(b=> b.classList.toggle('on', String(state.len)===b.dataset.len));
  $$('#dirSeg button').forEach(b=> b.classList.toggle('on', state.dir===b.dataset.dir));
  $$('#diffSeg button').forEach(b=> b.classList.toggle('on', state.diff===b.dataset.diff));
  $('#diffHint').textContent = DIFF_HINT[state.diff] || '';
  updateSelInfo();
}
function updateSelInfo(){
  const n = selectedCards().length;
  $('#selInfo').textContent = state.levels.length ? `Lv ${state.levels.join(',')}・${n}語` : '未選択';
  $('#bookCount').textContent = `(${n}語)`;
}

// ---- session build ----
function buildSession(mode){
  const pool = selectedCards();
  const due = shuffle(pool.filter(c=> rec(c) && rec(c).due <= now()));
  if(mode==='review') return due;
  const fresh = shuffle(pool.filter(c=> !rec(c)));
  let s = due.concat(fresh);
  if(s.length===0) s = shuffle(pool); // 全部学習済み→自由練習
  if(state.len!=='all') s = s.slice(0, state.len);
  return s;
}

// ---- QUIZ ----
let quiz = null;
function startQuiz(mode){
  if(!state.levels.length){ toast('レベルを1つ以上選んでください'); return; }
  const qs = buildSession(mode);
  if(!qs.length){
    toast(mode==='review' ? '今日の復習はありません 🎉' : '出題できる単語がありません');
    return;
  }
  quiz = { mode, qs, i:0, correct:0, answered:false, curDir:null };
  $('#qMode').textContent = mode==='review' ? '🔁 復習' : '▶ 学習';
  show('quiz'); renderQuestion();
}
function qDirFor(){ return state.dir==='mix' ? (Math.random()<.5?'e2j':'j2e') : state.dir; }

function distractors(q, dir){
  const key = dir==='e2j' ? 'ja' : 'word';
  const correct = q[key];
  const notSame = c => c._id!==q._id && c[key]!==correct;
  // 誤答は常に「同じ品詞」から選ぶ（表示品詞で答えを絞れないようにする）
  const samePos = c => notSame(c) && posMatch(q.pos, c.pos);
  let tiers;
  if(state.diff==='hard'){          // 紛らわしい：同じ品詞・同レベルを優先
    tiers = [
      WORDS.filter(c=> samePos(c) && c.level===q.level),
      WORDS.filter(samePos)
    ];
  } else if(state.diff==='easy'){   // やさしい：同じ品詞・別レベル（意味が離れ選びやすい）
    tiers = [
      WORDS.filter(c=> samePos(c) && c.level!==q.level),
      WORDS.filter(samePos)
    ];
  } else {                          // ふつう：同じ品詞からランダム
    tiers = [ WORDS.filter(samePos) ];
  }
  // 同品詞が3つに満たない場合のみ品詞不問で補完
  tiers.push(WORDS.filter(notSame));
  const seen = new Set([correct]); const out=[];
  for(const tier of tiers){
    for(const c of shuffle(tier)){
      if(out.length>=3) break;
      if(!seen.has(c[key])){ seen.add(c[key]); out.push(c[key]); }
    }
    if(out.length>=3) break;
  }
  return out;
}
function renderQuestion(){
  const q = quiz.qs[quiz.i];
  const dir = qDirFor(); quiz.curDir = dir;
  quiz.answered = false;
  $('#qCount').textContent = `${quiz.i+1} / ${quiz.qs.length}`;
  $('#qBar').style.width = (quiz.i/quiz.qs.length*100)+'%';
  $('#qFb').textContent=''; $('#qFb').className='fb';
  $('#qAns').classList.add('hidden'); $('#qNext').classList.add('hidden');

  const prompt = $('#qPrompt');
  if(dir==='e2j'){
    $('#qDir').textContent = '英語 → 意味';
    prompt.textContent = q.word; prompt.className='prompt';
    $('#qSpeak').classList.remove('hidden');
  } else {
    $('#qDir').textContent = '意味 → 英語';
    prompt.textContent = q.ja; prompt.className='prompt ja';
    $('#qSpeak').classList.add('hidden'); // 英単語を先に読むと答えがバレるため
  }
  $('#qPos').textContent = q.pos;

  const key = dir==='e2j' ? 'ja' : 'word';
  const correct = q[key];
  const opts = shuffle([correct, ...distractors(q, dir)]);
  const box = $('#qOptions'); box.innerHTML='';
  opts.forEach(txt=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=txt;
    b.addEventListener('click',()=>answer(txt, q, dir));
    box.appendChild(b);
  });
  if(dir==='e2j') speak(q.word);
}
function answer(sel, q, dir){
  if(quiz.answered) return;
  quiz.answered=true;
  const key = dir==='e2j' ? 'ja' : 'word';
  const correct = q[key];
  const ok = sel===correct;
  $$('#qOptions .opt').forEach(b=>{
    if(b.textContent===correct) b.classList.add('correct');
    else if(b.textContent===sel) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb=$('#qFb');
  fb.textContent = ok ? '正解！' : '不正解…';
  fb.className = 'fb '+(ok?'ok':'ng');
  $('#qAns').innerHTML = `<div class="pair">${q.word} — ${q.ja}</div><div class="exline">例: ${q.ex}　<span class="sub">Lv.${q.level}</span></div>`;
  $('#qAns').classList.remove('hidden');
  $('#qSpeak').classList.remove('hidden'); // 回答後は常に発音可
  $('#qNext').classList.remove('hidden');

  // ---- SRS update (Leitner) ----
  let r = rec(q) || {box:1, due:0, seen:0, correct:0};
  r.seen++;
  if(ok){ r.correct++; r.box = Math.min(r.box+1, 5); }
  else { r.box = 1; }
  r.due = now() + BOX_DAYS[r.box-1]*DAY;
  state.srs[q._id] = r;
  state.stats.total++; if(ok){ state.stats.correct++; quiz.correct++; }
  save();
}
$('#qNext').addEventListener('click',()=>{
  quiz.i++;
  if(quiz.i>=quiz.qs.length) finishQuiz();
  else renderQuestion();
});
function finishQuiz(){
  const total=quiz.qs.length, c=quiz.correct, acc=Math.round(c/total*100);
  $('#rScore').textContent = `${c} / ${total}`;
  $('#rAcc').textContent = acc+'%';
  $('#rMsg').textContent = acc===100 ? '全問正解！すばらしい 🎉'
    : acc>=70 ? 'good! この調子で 👍' : '間違えた語は近いうちにまた出ます 💪';
  $('#rReview').classList.toggle('hidden', dueCards().length===0);
  show('result'); renderHome();
}
$('#qSpeak').addEventListener('click',()=> quiz && speak(quiz.qs[quiz.i].word));
$('#qQuit').addEventListener('click',()=>{ show('home'); renderHome(); });
$('#rAgain').addEventListener('click',()=> startQuiz('study'));
$('#rReview').addEventListener('click',()=> startQuiz('review'));
$('#rHome').addEventListener('click',()=>{ show('home'); renderHome(); });

// ---- WORDBOOK ----
let bookFilter='all';
function statusOf(c){
  const r=rec(c);
  if(!r) return {k:'new', label:''};
  if(r.box>=5) return {k:'ok', label:'覚えた'};
  if(r.due<=now()) return {k:'due', label:'復習'};
  return {k:'learning', label:'学習中'};
}
function renderBook(){
  const q = $('#bookSearch').value.trim().toLowerCase();
  let list = selectedCards();
  if(bookFilter==='due') list=list.filter(c=>{const s=statusOf(c);return s.k==='due';});
  if(bookFilter==='ok') list=list.filter(c=> rec(c)&&rec(c).box>=5);
  if(q) list=list.filter(c=> c.word.toLowerCase().includes(q)||c.ja.includes(q)||c.ex.toLowerCase().includes(q));
  const box=$('#bookList'); box.innerHTML='';
  if(!list.length){ box.innerHTML='<div class="empty">該当する単語がありません</div>'; return; }
  list.forEach(c=>{
    const el=document.createElement('div'); el.className='wb';
    el.innerHTML=`
      <div class="wbhead">
        <span class="w">${c.word}</span>
        <span class="tag">${c.pos}</span>
        <button class="wbspk">🔊</button>
      </div>
      <div class="wbbody hidden">
        <div class="ja">${c.ja}</div>
        <div class="ex">例: ${c.ex}　<span class="sub">Lv.${c.level} / No.${c.id}</span></div>
        <div class="wbactions"><span class="flag"></span><button class="markbtn"></button></div>
      </div>`;
    const head=el.querySelector('.wbhead'), body=el.querySelector('.wbbody');
    const flagEl=el.querySelector('.flag'), markBtn=el.querySelector('.markbtn');
    function refresh(){
      const st=statusOf(c);
      flagEl.className='flag '+st.k;
      flagEl.textContent = st.label || '未学習';
      if(st.k==='ok'){ markBtn.textContent='↺ 学習中に戻す'; markBtn.classList.add('revert'); }
      else { markBtn.textContent='✓ 覚えた にする'; markBtn.classList.remove('revert'); }
    }
    refresh();
    head.addEventListener('click', e=>{ if(e.target.closest('.wbspk')) return; body.classList.toggle('hidden'); });
    el.querySelector('.wbspk').addEventListener('click', e=>{ e.stopPropagation(); speak(c.word); });
    markBtn.addEventListener('click', e=>{
      e.stopPropagation();
      const st=statusOf(c);
      const r = rec(c) || {box:1, due:0, seen:0, correct:0};
      if(st.k==='ok'){ r.box=2; r.due=now()+BOX_DAYS[1]*DAY; }  // 覚えた→学習中に戻す
      else { r.box=5; r.due=now()+BOX_DAYS[4]*DAY; }            // →覚えた（習得済み）
      state.srs[c._id]=r; save();
      const d=$('#stDue'); if(d) d.textContent=dueCards().length;
      const m=$('#stMastered'); if(m) m.textContent=masteredCards().length;
      if(bookFilter!=='all') renderBook(); else refresh();
    });
    box.appendChild(el);
  });
}
$('#bookSearch').addEventListener('input', renderBook);
function setBookFilter(f, btn){ bookFilter=f; ['#bookAll','#bookDue','#bookOk'].forEach(s=>$(s).classList.remove('on')); btn.classList.add('on'); renderBook(); }
$('#bookAll').addEventListener('click', e=> setBookFilter('all', e.currentTarget));
$('#bookDue').addEventListener('click', e=> setBookFilter('due', e.currentTarget));
$('#bookOk').addEventListener('click', e=> setBookFilter('ok', e.currentTarget));
function openBook(){ setBookFilter('all', $('#bookAll')); show('book'); }

// ---- HOME buttons ----
$('#selAll').addEventListener('click',()=>{ state.levels=LEVELS.slice(); save(); renderHome(); });
$('#selNone').addEventListener('click',()=>{ state.levels=[]; save(); renderHome(); });
$$('#lenSeg button').forEach(b=> b.addEventListener('click',()=>{
  state.len = b.dataset.len==='all' ? 'all' : +b.dataset.len; save();
  $$('#lenSeg button').forEach(x=>x.classList.toggle('on',x===b));
}));
$$('#dirSeg button').forEach(b=> b.addEventListener('click',()=>{
  state.dir = b.dataset.dir; save();
  $$('#dirSeg button').forEach(x=>x.classList.toggle('on',x===b));
}));
$$('#diffSeg button').forEach(b=> b.addEventListener('click',()=>{
  state.diff = b.dataset.diff; save();
  $$('#diffSeg button').forEach(x=>x.classList.toggle('on',x===b));
  $('#diffHint').textContent = DIFF_HINT[state.diff] || '';
}));
$('#startStudy').addEventListener('click',()=> startQuiz('study'));
$('#startReview').addEventListener('click',()=> startQuiz('review'));
$('#startBook').addEventListener('click', openBook);
$('#resetProg').addEventListener('click',()=>{
  if(confirm('進捗（学習状況・正答率）をすべて消去しますか？')){
    state.srs={}; state.stats={correct:0,total:0}; save(); renderHome(); toast('リセットしました');
  }
});
$$('footer button').forEach(b=> b.addEventListener('click',()=>{
  const n=b.dataset.nav;
  if(n==='home'){ show('home'); renderHome(); }
  else if(n==='book'){ openBook(); }
  else if(n==='reviewNav'){ startQuiz('review'); }
}));

// init
renderHome();
show('home');
</script>
